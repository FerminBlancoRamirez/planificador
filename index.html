<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <h1>Planificación del curso</h1>

    <div class="form">

        class="texto"
        type="text"
        id="texto"

        class="min"
        id="min"
        type="number"

        placeholder="60 min"
      />

      <button id="añadir">Añadir</button>
    </div>

    <ul id="lista"></ul>

    <script type="module" src="/src/main.js"></script>
